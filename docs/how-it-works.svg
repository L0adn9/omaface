<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5a6075"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="2" height="2" fill="#aab4d2" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="960" height="420" rx="10" fill="#0e0e10"/>
  <rect width="960" height="420" rx="10" fill="url(#dots)"/>

  <!-- where it is used -->
  <g font-size="14" fill="#d8dce4">
    <g transform="translate(30 40)">
      <rect width="190" height="54" rx="4" fill="#151518" stroke="#2a2b33"/>
      <text x="16" y="24">lock screen</text>
      <text x="16" y="42" font-size="11" fill="#7d8296">scans on wake</text>
    </g>
    <g transform="translate(30 108)">
      <rect width="190" height="54" rx="4" fill="#151518" stroke="#2a2b33"/>
      <text x="16" y="24">login screen</text>
      <text x="16" y="42" font-size="11" fill="#7d8296">SDDM, at boot</text>
    </g>
    <g transform="translate(30 176)">
      <rect width="190" height="54" rx="4" fill="#151518" stroke="#2a2b33"/>
      <text x="16" y="24">sudo</text>
      <text x="16" y="42" font-size="11" fill="#7d8296">Enter = omaFace</text>
    </g>
    <g transform="translate(30 244)">
      <rect width="190" height="54" rx="4" fill="#151518" stroke="#2a2b33"/>
      <text x="16" y="24">system prompts</text>
      <text x="16" y="42" font-size="11" fill="#7d8296">click or Enter = omaFace</text>
    </g>
  </g>

  <!-- PAM -->
  <g transform="translate(270 110)">
    <rect width="200" height="118" rx="4" fill="#151518" stroke="#2a2b33"/>
    <text x="16" y="28" font-size="14" fill="#d8dce4">PAM</text>
    <text x="16" y="52" font-size="11" fill="#7d8296">one "sufficient" line</text>
    <text x="16" y="68" font-size="11" fill="#7d8296">above the password</text>
    <text x="16" y="96" font-size="11" fill="#7aa2f7">anything but a match</text>
    <text x="16" y="111" font-size="11" fill="#7aa2f7">falls to the password</text>
  </g>
  <g stroke="#5a6075" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M220 67H245V150H268"/>
    <path d="M220 135H245V160H268"/>
    <path d="M220 203H245V175H268"/>
    <path d="M220 271H245V190H268"/>
  </g>

  <!-- socket -->
  <g stroke="#5a6075" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M470 169H508"/>
  </g>
  <g transform="translate(512 140)">
    <rect width="140" height="58" rx="4" fill="#151518" stroke="#2a2b33"/>
    <text x="14" y="25" font-size="13" fill="#d8dce4">omaface.sock</text>
    <text x="14" y="43" font-size="11" fill="#7d8296">systemd, on demand</text>
  </g>
  <g stroke="#5a6075" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M652 169H690"/>
  </g>

  <!-- engine -->
  <g transform="translate(694 30)">
    <rect width="240" height="330" rx="4" fill="#151518" stroke="#7aa2f7" stroke-opacity="0.55"/>
    <text x="16" y="28" font-size="14" fill="#d8dce4">scanner</text>
    <text x="16" y="46" font-size="11" fill="#7d8296">sandboxed, exits after</text>
    <text x="16" y="61" font-size="11" fill="#7d8296">each scan, no network</text>

    <g font-size="12" fill="#d8dce4">
      <rect x="16" y="80" width="208" height="40" rx="3" fill="#1b1c22"/>
      <text x="28" y="98">1  ask first, you choose</text>
      <text x="28" y="113" font-size="10" fill="#7d8296">sudo + prompts; camera stays off</text>

      <rect x="16" y="128" width="208" height="40" rx="3" fill="#1b1c22"/>
      <text x="28" y="146">2  find a face</text>
      <text x="28" y="161" font-size="10" fill="#7d8296">YuNet, IR-lit frames</text>

      <rect x="16" y="176" width="208" height="40" rx="3" fill="#1b1c22"/>
      <text x="28" y="194">3  is it you</text>
      <text x="28" y="209" font-size="10" fill="#7d8296">SFace, 2 frames in a row</text>

      <rect x="16" y="224" width="208" height="56" rx="3" fill="#1b1c22"/>
      <text x="28" y="242">4  are you there</text>
      <text x="28" y="257" font-size="10" fill="#7d8296">IR: eyes open, on camera</text>
      <text x="28" y="271" font-size="10" fill="#7d8296">webcam: random head turns</text>
    </g>
    <text x="16" y="306" font-size="12" fill="#7aa2f7">match  →  unlocked</text>
    <text x="16" y="322" font-size="12" fill="#bb9af7">no  →  your password</text>
  </g>

  <!-- camera + models -->
  <g transform="translate(512 250)">
    <rect width="140" height="110" rx="4" fill="#151518" stroke="#2a2b33"/>
    <text x="14" y="25" font-size="13" fill="#d8dce4">camera</text>
    <text x="14" y="44" font-size="11" fill="#7d8296">IR (Windows Hello)</text>
    <text x="14" y="59" font-size="11" fill="#7d8296">first; else the</text>
    <text x="14" y="74" font-size="11" fill="#7d8296">webcam + head turns</text>
    <text x="14" y="96" font-size="11" fill="#7aa2f7">off when idle</text>
  </g>
  <g stroke="#5a6075" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M652 305H690"/>
  </g>

  <text x="30" y="396" font-size="12" fill="#7d8296">Nothing stays in memory. No images are saved. Faces stay on the machine, readable by root and you.</text>
</svg>
